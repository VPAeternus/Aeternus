[supervisord]
logfile=/var/log/aeternus/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=false
user=aeternus

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:aeternus-workflow]
command=/usr/local/bin/aeternus workflow-loop
autorestart=true
autostart=true
stdout_logfile=/var/log/aeternus/workflow.log
stderr_logfile=/var/log/aeternus/workflow_error.log
user=aeternus
directory=/opt/aeternus
environment=PATH="/usr/local/bin:/usr/bin:/bin",HOME="/home/aeternus"

[program:aeternus-reconciliation]
command=/usr/local/bin/aeternus reconciliation-loop
autorestart=true
autostart=true
stdout_logfile=/var/log/aeternus/reconciliation.log
stderr_logfile=/var/log/aeternus/reconciliation_error.log
user=aeternus
directory=/opt/aeternus
environment=PATH="/usr/local/bin:/usr/bin:/bin",HOME="/home/aeternus"
